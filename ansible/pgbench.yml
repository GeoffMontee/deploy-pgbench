---
- name: Run pgbench from loader nodes
  hosts: pgbench_loaders
  gather_facts: false

  vars:
    pgbench_base_environment:
      PGPASSWORD: "{{ pg_password }}"
      PGSSLMODE: "{{ pg_sslmode }}"
    pgbench_schema_environment: "{{ {'PGOPTIONS': '-c search_path=' ~ pg_schema} if pg_schema | length > 0 else {} }}"
    pgbench_environment: "{{ pgbench_base_environment | combine(pgbench_schema_environment) }}"

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Verify pgbench is available
      ansible.builtin.command: pgbench --version
      changed_when: false

    - name: Initialize pgbench schema
      ansible.builtin.command: >-
        pgbench
        --initialize
        --scale {{ pgbench_scale }}
        --host {{ pg_host }}
        --port {{ pg_port }}
        --username {{ pg_user }}
        {{ pgbench_extra_args }}
        {{ pg_database }}
      environment: "{{ pgbench_environment }}"
      async: "{{ pgbench_async_timeout }}"
      poll: "{{ pgbench_poll_interval }}"
      register: pgbench_initialize
      failed_when: false
      when: pgbench_mode == "initialize"

    - name: Show initialize stdout
      ansible.builtin.debug:
        msg: "{{ pgbench_initialize.stdout_lines }}"
      when:
        - pgbench_mode == "initialize"
        - pgbench_initialize.stdout_lines | default([]) | length > 0

    - name: Show initialize stderr
      ansible.builtin.debug:
        msg: "{{ pgbench_initialize.stderr_lines }}"
      when:
        - pgbench_mode == "initialize"
        - pgbench_initialize.stderr_lines | default([]) | length > 0

    - name: Fail when initialize fails
      ansible.builtin.fail:
        msg: >-
          pgbench initialize failed with rc={{ pgbench_initialize.rc | default('unknown') }}.
          {{ pgbench_initialize.msg | default('See stdout/stderr above.') }}
      when:
        - pgbench_mode == "initialize"
        - pgbench_initialize.rc is not defined or pgbench_initialize.rc | int != 0

    - name: Run pgbench workload
      ansible.builtin.command: >-
        pgbench
        --client {{ pgbench_clients }}
        --jobs {{ pgbench_jobs }}
        {% if pgbench_time | int > 0 %}--time {{ pgbench_time }}{% endif %}
        {% if pgbench_transactions | int > 0 %}--transactions {{ pgbench_transactions }}{% endif %}
        {% if pgbench_rate | int > 0 %}--rate {{ pgbench_rate }}{% endif %}
        {% if pgbench_progress | int > 0 %}--progress {{ pgbench_progress }}{% endif %}
        --host {{ pg_host }}
        --port {{ pg_port }}
        --username {{ pg_user }}
        {{ pgbench_extra_args }}
        {{ pg_database }}
      environment: "{{ pgbench_environment }}"
      async: "{{ pgbench_async_timeout }}"
      poll: "{{ pgbench_poll_interval }}"
      changed_when: false
      failed_when: false
      register: pgbench_run
      when: pgbench_mode == "run"

    - name: Show run stdout
      ansible.builtin.debug:
        msg: "{{ pgbench_run.stdout_lines }}"
      when:
        - pgbench_mode == "run"
        - pgbench_run.stdout_lines | default([]) | length > 0

    - name: Show run stderr
      ansible.builtin.debug:
        msg: "{{ pgbench_run.stderr_lines }}"
      when:
        - pgbench_mode == "run"
        - pgbench_run.stderr_lines | default([]) | length > 0

    - name: Fail when run fails
      ansible.builtin.fail:
        msg: >-
          pgbench run failed with rc={{ pgbench_run.rc | default('unknown') }}.
          {{ pgbench_run.msg | default('See stdout/stderr above.') }}
      when:
        - pgbench_mode == "run"
        - pgbench_run.rc is not defined or pgbench_run.rc | int != 0
